services:
  db:
    image: postgres:18-alpine
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      PGDATABASE: ${PGDATABASE:-{{cookiecutter.project_name}}}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-{{cookiecutter.project_name}}}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  django:
    build: .
    volumes:
      - media_storage:/usr/src/app/media
      - private_storage:/usr/src/app/private
      - ./logs:/var/log
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-{{cookiecutter.project_name}}}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-{{cookiecutter.project_name}}.settings.development}
      REDIS_HOST: valkey
      # Development-only key. Generate a fresh one per environment and inject it via secrets in production.
      SECRET_KEY: ${SECRET_KEY:-'oqjwvmob^(qwlil^8ub8%a@o5@a!^x0j1*^*1m@y46k%(6+w'}
    ports:
      - 8000:8000
    depends_on:
      - db
  # Valkey: BSD-licensed, drop-in replacement for Redis (same protocol/commands).
  # Used instead of Redis to avoid Redis' SSPL/RSAL/AGPL licensing.
  valkey:
    image: "valkey/valkey:8-alpine"
    command: valkey-server
    ports:
      - "6379:6379"
    volumes:
      - ./data/valkey:/data
volumes:
  private_storage:
  media_storage:
